name: build-windows

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install pyinstaller numpy scipy
      - name: Build the exe
        run: pyinstaller --clean --noconfirm wtxapp.spec
      - name: Upload the exe
        uses: actions/upload-artifact@v7
        with:
          name: WinTAX-ECU-Downloader
          path: dist/WinTAX-ECU-Downloader.exe
